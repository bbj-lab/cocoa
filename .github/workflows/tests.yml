name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, to catch breakage from new releases of unpinned dependencies
    - cron: "0 11 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets the codecov upload authenticate by oidc, with no secret
    strategy:
      fail-fast: false
      matrix:
        # from requires-python in pyproject.toml through the newest release;
        # if this list changes length, update after_n_builds in codecov.yml
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[test]'
      # for the tests of `cocoa get-demo`, which skip without it; clifpy pins pandas
      # 2.3.3, which has no wheels past python 3.14
      - run: pip install '.[demo]'
        if: matrix.python-version != '3.15'
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: codecov/codecov-action@v7
        # coverage is informational: nothing in this step can fail the job
        continue-on-error: true
        with:
          files: coverage.xml
          disable_search: true
          name: python-${{ matrix.python-version }}
          # fork prs can't get an oidc token; the action uploads those tokenless
          use_oidc: true

  pytest-lowest:
    # each dependency at the oldest version pyproject.toml allows
    name: pytest (python 3.11, lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install uv
      # not the demo extra: pyarrow, which clifpy imports, needs numpy 2, newer than
      # cocoa's floor, without declaring it, so clifpy would fail to import
      - run: uv pip install --system --resolution lowest-direct '.[test]'
      - run: pytest
