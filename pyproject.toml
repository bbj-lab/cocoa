[project]
    authors = [
        { name = "Michael C. Burkhart <burkh4rt@uchicago.edu>, Luke Solo <lsolo@uchicago.edu>, Inhyeok Lee <ihlee@uchicago.edu>, S'Khaja Charles <skhaja@uchicago.edu>, & Brett K. Beaulieu-Jones <beaulieujones@uchicago.edu>" },
    ]
    classifiers = [
        "Intended Audience :: Science/Research",
        "Natural Language :: English",
        "Programming Language :: Python :: 3",
    ]
    dependencies = [
        "deepdiff>=6.6",
        # deepdiff 9.1 pins cachebox<6, which has no 3.15 wheels and won't build there
        "deepdiff!=9.1.*; python_version >= '3.15'",
        "numpy>=1.23.2",
        "omegaconf>=2.2.1",
        "polars>=1.36.1",
        "pyyaml>=6.0",
        "rich>=13.8",
        "typer>=0.26",
    ]
    description = "configurable collator and tokenizer"
    keywords = [ "data collation", "generative event models", "tokenization" ]
    license = "MIT"
    license-files = [ "LICEN[CS]E.*" ]
    name = "cocoa-tokenizer"
    readme = { file = "README.md", content-type = "text/markdown" }
    requires-python = ">=3.11"
    version = "26.10.1"

    [project.scripts]
        cocoa = "cocoa.cli:main"

    [project.urls]
        Documentation = "https://cocoa-tokenizer.readthedocs.io"
        Issues        = "https://github.com/bbj-lab/cocoa/issues"
        Repository    = "https://github.com/bbj-lab/cocoa"

    [project.optional-dependencies]
        all = [ "cocoa-tokenizer[dev,docs,test]" ]
        dev = [ "pip>=21.3", "ruff>=0.9" ]
        docs = [
            "mkdocs>=1.5.3,<2",
            "mkdocs-material>=9.4",
            "mkdocstrings[python]>=0.27",
            "mkdocs-include-markdown-plugin>=4.0",
            "mkdocs-callouts>=1.10",
            "mkdocs-git-revision-date-localized-plugin>=0.5",
        ]
        test = [ "pytest>=7.0", "pytest-cov>=6" ]

[build-system]
    build-backend = "setuptools.build_meta"
    requires      = [ "setuptools>=77" ]

[tool.ruff]
    extend-exclude = [ "*.md" ]
    line-length    = 88

    [tool.ruff.format]
        docstring-code-format     = true
        indent-style              = "space"
        line-ending               = "lf"
        quote-style               = "double"
        skip-magic-trailing-comma = true

    [tool.ruff.lint]
        ignore = [ "E731" ]
        select = [ "E", "F", "I" ]

        [tool.ruff.lint.isort]
            known-first-party       = [ "cocoa", "cotorra" ]
            split-on-trailing-comma = false

[tool.setuptools]
    include-package-data = true

    [tool.setuptools.packages.find]
        where = [ "src" ]

    [tool.setuptools.package-data]
        "cocoa.assets" = [ "*.css", "*.html", "*.js", "*.svg", "fonts/*.otf" ]
        "cocoa.config" = [ "*.yaml" ]

[tool.pytest.ini_options]
    addopts = [
        "--import-mode=importlib",
        "--strict-config",
        "--strict-markers",
    ]
    log_level = "INFO"
    pythonpath = [ "src", "tests" ]
    testpaths = [ "tests" ]

[tool.coverage.run]
    branch      = true
    source_pkgs = [ "cocoa" ]

[tool.coverage.report]
    # the __main__ blocks self-test against local real data, which ci lacks
    exclude_also = [ 'if __name__ == "__main__":' ]
